name: JavaGoat-Bot
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install
      - name: Start Bot
        env:
          PHONE_NUMBER: ${{ secrets.PHONE_NUMBER }}
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
        run: node index.js
